[project]
name = "youlai-fastapi"
version = "1.1.0"
description = "vue3-element-admin 的 FastAPI 后端，基于 FastAPI + SQLAlchemy + PostgreSQL/Redis 构建"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "youlai", email = "youlaitech@163.com" }
]
keywords = ["fastapi", "admin", "youlai", "backend"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

dependencies = [
    # Web
    "fastapi[standard]>=0.115.0,<1",
    "uvicorn[standard]>=0.30.0,<1",
    # ORM
    "sqlalchemy[asyncio]>=2.0.30,<3",
    "asyncpg>=0.29.0,<1",
    "alembic>=1.13.0,<2",
    # Validation
    "pydantic[email]>=2.8.0,<3",
    "pydantic-settings>=2.3.0,<3",
    # Auth
    "pyjwt[crypto]>=2.8.0,<3",
    "bcrypt>=4.2.0,<5",
    "python-multipart>=0.0.9,<1",
    # Cache
    "redis[hiredis]>=5.0.0,<6",
    # JSON
    "orjson>=3.10.0,<4",
    # Logging
    "loguru>=0.7.0,<1",
    # Pagination
    "fastapi-pagination>=0.12.0,<1",
    # SSE
    "sse-starlette>=2.0.0,<3",
    # Captcha
    "pillow>=10.4.0,<12",
    # Excel
    "openpyxl>=3.1.0,<4",
    # File storage (S3 / RustFS)
    "boto3>=1.34.0,<2",
    # Task queue
    # "arq>=0.26.0,<1",
    # Rate limiting
    "slowapi>=0.1.9,<1",
    # Template
    "jinja2>=3.1.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9",
    "pytest-asyncio>=0.23.0,<1",
    "pytest-cov>=5.0.0,<6",
    "httpx>=0.27.0,<1",
    "ruff>=0.5.0,<1",
    "mypy>=1.10.0,<2",
    "pre-commit>=3.8.0,<4",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "C4",  # flake8-comprehensions
    "ASYNC",   # flake8-async
    "SIM",     # flake8-simplify
]
ignore = [
    "S101",  # assert (test)
    "S104",  # possible binding to all interfaces (dev)
    "S301",  # pickle (not used)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=app --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["app"]
omit = ["alembic/*", "tests/*"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
